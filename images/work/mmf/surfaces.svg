<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 300" width="552" height="300" role="img" aria-label="Three surfaces in one prototype portal. A landing site of three pages, a mobile app of twenty flows, and a web app of fifteen flows. The mobile app carries six flow families: start and login with four, investment with three, automatic investment with two, wallet with four, loan with three, and everything else with four.">
  <style>
    .ink { fill: #111111 } .mid { fill: #888888 } .dim { fill: #a3a3a3 }
    .box { fill: none; stroke: #e4e4e4; stroke-width: 1.25 }
    .key { fill: #4b3fd6; stroke: #4b3fd6; stroke-width: 1.25 }
    .a { fill: #e4e2f7 } .white { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ededed } .mid { fill: #9e9e9e } .dim { fill: #7c7c7c }
      .box { stroke: #262626 } .key { fill: #6255e8; stroke: #6255e8 } .a { fill: #241f4a }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
    .l { font-size: 10px; letter-spacing: 0.09em }
    .t { font-size: 12px; font-weight: 500 } .s { font-size: 10.5px }
    .n { font-size: 20px; font-weight: 600 }
  </style>

  <text class="l mid" x="0" y="10">ONE PORTAL, THREE SURFACES</text>

  <rect class="box" x="0" y="22" width="168" height="76" rx="9"/>
  <text class="n ink" x="14" y="52">3</text>
  <text class="t ink" x="44" y="52">pages</text>
  <text class="s dim" x="14" y="72">Landing site</text>
  <text class="s dim" x="14" y="88">about, repo benchmark, app</text>

  <rect class="key" x="192" y="22" width="168" height="76" rx="9"/>
  <text class="n white" x="206" y="52">20</text>
  <text class="t white" x="244" y="52">flows</text>
  <text class="s white" x="206" y="72" opacity="0.8">Mobile app</text>
  <text class="s white" x="206" y="88" opacity="0.62">iPhone, 390 by 844</text>

  <rect class="box" x="384" y="22" width="168" height="76" rx="9"/>
  <text class="n ink" x="398" y="52">15</text>
  <text class="t ink" x="432" y="52">flows</text>
  <text class="s dim" x="398" y="72">Web app</text>
  <text class="s dim" x="398" y="88">browser, 1440 wide</text>

  <text class="l mid" x="0" y="136">WHAT THE MOBILE APP IS MADE OF</text>

  <g>
    <rect class="a" x="0"   y="150" width="86" height="16" rx="2"/><text class="s ink" x="0"   y="182">4  start, login</text>
    <rect class="a" x="92"  y="150" width="66" height="16" rx="2"/><text class="s ink" x="92"  y="182">3  buy, sell</text>
    <rect class="a" x="164" y="150" width="46" height="16" rx="2"/><text class="s ink" x="164" y="182">2  auto</text>
    <rect class="a" x="216" y="150" width="86" height="16" rx="2"/><text class="s ink" x="216" y="182">4  wallet</text>
    <rect class="a" x="308" y="150" width="66" height="16" rx="2"/><text class="s ink" x="308" y="182">3  loan</text>
    <rect class="a" x="380" y="150" width="86" height="16" rx="2"/><text class="s ink" x="380" y="182">4  the rest</text>
  </g>

  <text class="s mid" x="0" y="222">Only three of the twenty flows are the thing people think this app is for,</text>
  <text class="s mid" x="0" y="240">which is buying and selling. The other seventeen are the conditions that</text>
  <text class="s mid" x="0" y="258">have to hold before anybody is allowed to.</text>
  <text class="s dim" x="0" y="286">Counted off the prototype portal, which lists every flow and its steps.</text>
</svg>
