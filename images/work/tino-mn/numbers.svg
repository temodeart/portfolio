<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 236" width="552" height="236" role="img" aria-label="The old page made zero numeric claims. The new one makes fifteen, listed here: 29 mini-apps, 12,000 plus merchants, 400 plus stations, 140 plus lobby fridges, 40,000 people a day, 4.8 stars, 1.2 million downloads, a fixed 25,000 tugrik airport fare, first 30 minutes free, 12 percent battery, 60 fuel stations, 7 days of pre-booking, 2 hour parcel delivery, 24 by 7 assistance, and a 4 minute average wait.">
  <style>
    .ink  { fill: #111111 }
    .mid  { fill: #888888 }
    .dim  { fill: #a3a3a3 }
    .pill { fill: #f4f4f4; stroke: #e6e6e6; stroke-width: 1 }
    .zero { fill: none; stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 4 4 }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #ededed }
      .mid  { fill: #9e9e9e }
      .dim  { fill: #7c7c7c }
      .pill { fill: #1a1a1a; stroke: #2a2a2a }
      .zero { stroke: #333333 }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
    .l { font-size: 10px; letter-spacing: 0.09em }
    .s { font-size: 10.5px }
    .n { font-size: 10.5px; font-weight: 500 }
    .big { font-size: 30px; font-weight: 600 }
  </style>

  <text class="l mid" x="0" y="12">OLD</text>
  <rect class="zero" x="0" y="24" width="150" height="58" rx="8"/>
  <text class="big dim" x="75" y="62" text-anchor="middle">0</text>
  <text class="s dim" x="0" y="102">numbers anywhere on the</text>
  <text class="s dim" x="0" y="118">page. Every claim is an</text>
  <text class="s dim" x="0" y="134">adjective.</text>

  <text class="l mid" x="196" y="12">NEW</text>
  <text class="big ink" x="196" y="52">15</text>
  <text class="s dim" x="240" y="52">things a reader can check</text>

  <g>
    <rect class="pill" x="196" y="70" width="88"  height="22" rx="11"/><text class="n ink" x="240" y="85" text-anchor="middle">29 mini-apps</text>
    <rect class="pill" x="290" y="70" width="108" height="22" rx="11"/><text class="n ink" x="344" y="85" text-anchor="middle">12,000+ merchants</text>
    <rect class="pill" x="404" y="70" width="88"  height="22" rx="11"/><text class="n ink" x="448" y="85" text-anchor="middle">400+ stations</text>

    <rect class="pill" x="196" y="98" width="106" height="22" rx="11"/><text class="n ink" x="249" y="113" text-anchor="middle">140+ lobby fridges</text>
    <rect class="pill" x="308" y="98" width="112" height="22" rx="11"/><text class="n ink" x="364" y="113" text-anchor="middle">40,000 riders a day</text>
    <rect class="pill" x="426" y="98" width="52"  height="22" rx="11"/><text class="n ink" x="452" y="113" text-anchor="middle">4.8 &#9733;</text>

    <rect class="pill" x="196" y="126" width="96"  height="22" rx="11"/><text class="n ink" x="244" y="141" text-anchor="middle">1.2M downloads</text>
    <rect class="pill" x="298" y="126" width="120" height="22" rx="11"/><text class="n ink" x="358" y="141" text-anchor="middle">&#8366;25,000 to the airport</text>
    <rect class="pill" x="424" y="126" width="98"  height="22" rx="11"/><text class="n ink" x="473" y="141" text-anchor="middle">first 30 min free</text>

    <rect class="pill" x="196" y="154" width="84"  height="22" rx="11"/><text class="n ink" x="238" y="169" text-anchor="middle">60 fuel stations</text>
    <rect class="pill" x="286" y="154" width="104" height="22" rx="11"/><text class="n ink" x="338" y="169" text-anchor="middle">book 7 days ahead</text>
    <rect class="pill" x="396" y="154" width="112" height="22" rx="11"/><text class="n ink" x="452" y="169" text-anchor="middle">parcels under 2 hours</text>

    <rect class="pill" x="196" y="182" width="96"  height="22" rx="11"/><text class="n ink" x="244" y="197" text-anchor="middle">a ride in ~4 min</text>
    <rect class="pill" x="298" y="182" width="74"  height="22" rx="11"/><text class="n ink" x="335" y="197" text-anchor="middle">24/7 Tino AI</text>
    <rect class="pill" x="378" y="182" width="96"  height="22" rx="11"/><text class="n ink" x="426" y="197" text-anchor="middle">12% battery left</text>
  </g>

  <text class="s dim" x="196" y="224">Every one of these is a promise somebody now has to keep.</text>
</svg>
