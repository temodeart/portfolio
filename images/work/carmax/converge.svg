<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 322" width="552" height="322" role="img" aria-label="Three purchase paths converge. Buying in stock with cash, buying with a Midas loan, and ordering a car that takes 45 to 60 days all end at the same two steps: a 500,000 tugrik reservation fee and a booked appointment to sign the contract in person at the branch.">
  <style>
    .ink { fill: #111111 } .mid { fill: #888888 } .dim { fill: #a3a3a3 }
    .box { fill: none; stroke: #e4e4e4; stroke-width: 1.25 }
    .key { fill: #16233f; stroke: #16233f; stroke-width: 1.25 }
    .line { stroke: #d2d2d2; stroke-width: 1.25; fill: none }
    .head { fill: #d2d2d2 } .white { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ededed } .mid { fill: #9e9e9e } .dim { fill: #7c7c7c }
      .box { stroke: #262626 } .key { fill: #2d3f6b; stroke: #2d3f6b }
      .line { stroke: #383838 } .head { fill: #383838 }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
    .l { font-size: 10px; letter-spacing: 0.09em }
    .t { font-size: 12px; font-weight: 500 } .s { font-size: 10.5px }
  </style>
  <marker id="d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path class="head" d="M0 0 L8 4 L0 8 Z"/>
  </marker>

  <text class="l mid" x="0" y="10">THREE WAYS IN</text>

  <rect class="box" x="0" y="24" width="168" height="54" rx="8"/>
  <text class="t ink" x="12" y="45">In stock, cash</text>
  <text class="s dim" x="12" y="63">pay the balance later</text>

  <rect class="box" x="0" y="88" width="168" height="54" rx="8"/>
  <text class="t ink" x="12" y="109">In stock, on a loan</text>
  <text class="s dim" x="12" y="127">Midas Finance, 76 months</text>

  <rect class="box" x="0" y="152" width="168" height="54" rx="8"/>
  <text class="t ink" x="12" y="173">Order one</text>
  <text class="s dim" x="12" y="191">45 to 60 days to arrive</text>

  <path class="line" d="M168 51 L206 51 L206 115 L238 115" marker-end="url(#d)"/>
  <path class="line" d="M168 115 L238 115"/>
  <path class="line" d="M168 179 L206 179 L206 115"/>

  <text class="l mid" x="238" y="10">ONE WAY OUT</text>

  <rect class="key" x="238" y="24" width="152" height="54" rx="8"/>
  <text class="t white" x="250" y="45">500,000₮</text>
  <text class="s white" x="250" y="63" opacity="0.75">reservation fee</text>

  <path class="line" d="M314 78 L314 88"/>

  <rect class="key" x="238" y="88" width="152" height="54" rx="8"/>
  <text class="t white" x="250" y="109">A time slot</text>
  <text class="s white" x="250" y="127" opacity="0.75">to sign, in person</text>

  <path class="line" d="M390 115 L424 115" marker-end="url(#d)"/>

  <rect class="box" x="424" y="88" width="128" height="54" rx="8"/>
  <text class="t ink" x="436" y="109">The branch</text>
  <text class="s dim" x="436" y="127">paperwork, keys</text>

  <text class="s mid" x="0" y="238">Nothing on this site actually sells a car. All three paths stop at the</text>
  <text class="s mid" x="0" y="256">same door, and the deposit counts toward the price rather than</text>
  <text class="s mid" x="0" y="274">sitting on top of it.</text>
  <text class="s dim" x="0" y="302">The product is not a checkout. It is a booking system with a car catalogue on the front.</text>
</svg>
