<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 268" width="552" height="268" role="img" aria-label="Six findings sorted into two groups. Three take something away: the organisation picker on sign-in, the DONE label next to a checkmark, and the wrong icon on a colour control. Three add direction: starting prompts in the empty AI state, an explicit next step alongside follow-up questions, and showing the setup checklist from the start rather than after the second step.">
  <style>
    .ink { fill: #111111 } .mid { fill: #888888 } .dim { fill: #a3a3a3 }
    .box { fill: none; stroke: #e4e4e4; stroke-width: 1.25 }
    .cut { fill: #f2f2f2 } .add { fill: #16233f }
    .white { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ededed } .mid { fill: #9e9e9e } .dim { fill: #7c7c7c }
      .box { stroke: #262626 } .cut { fill: #1e1e1e } .add { fill: #2d3f6b }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
    .l { font-size: 10px; letter-spacing: 0.09em }
    .t { font-size: 11.5px; font-weight: 500 } .s { font-size: 10.5px }
    .n { font-size: 10px; font-weight: 600 }
  </style>

  <text class="l mid" x="0" y="10">THREE TAKE SOMETHING AWAY</text>
  <rect class="cut" x="0" y="22" width="264" height="34" rx="6"/>
  <text class="n mid" x="10" y="43">01</text>
  <text class="t ink" x="32" y="43">The organisation picker on sign-in</text>
  <rect class="cut" x="0" y="60" width="264" height="34" rx="6"/>
  <text class="n mid" x="10" y="81">03</text>
  <text class="t ink" x="32" y="81">&#8220;DONE&#8221; next to a tick that says done</text>
  <rect class="cut" x="0" y="98" width="264" height="34" rx="6"/>
  <text class="n mid" x="10" y="119">06</text>
  <text class="t ink" x="32" y="119">An icon that hides a colour picker</text>

  <text class="l mid" x="288" y="10">THREE ADD DIRECTION</text>
  <rect class="add" x="288" y="22" width="264" height="34" rx="6"/>
  <text class="n white" x="298" y="43" opacity="0.7">02</text>
  <text class="t white" x="320" y="43">Prompts in the empty AI state</text>
  <rect class="add" x="288" y="60" width="264" height="34" rx="6"/>
  <text class="n white" x="298" y="81" opacity="0.7">04</text>
  <text class="t white" x="320" y="81">A next step, not only more questions</text>
  <rect class="add" x="288" y="98" width="264" height="34" rx="6"/>
  <text class="n white" x="298" y="119" opacity="0.7">05</text>
  <text class="t white" x="320" y="119">The checklist from step one</text>

  <text class="s mid" x="0" y="170">The platform was good at reporting what it had just finished and poor at</text>
  <text class="s mid" x="0" y="188">saying what to do next. Every finding is one or the other: stop spending</text>
  <text class="s mid" x="0" y="206">the user&#8217;s attention on something that carries no information, or spend it</text>
  <text class="s mid" x="0" y="224">on the thing they are about to need.</text>
  <text class="s dim" x="0" y="252">Six findings, one pass, on a product that had never had a designer look at it.</text>
</svg>
