<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 300" width="552" height="300" role="img" aria-label="The eight onboarding steps marked by whether they can be skipped. Splash, language, the log in or register choice, and the sign-up screen are required. Welcome with the local or travelling question, the unlock card prompt and the wallet all carry a close button and can be dismissed. Only two screens stand between opening the app and having an account.">
  <style>
    .ink { fill: #111111 } .mid { fill: #888888 } .dim { fill: #a3a3a3 }
    .need { fill: #2a3fdb; stroke: #2a3fdb; stroke-width: 1.25 }
    .skip { fill: none; stroke: #c9c9c9; stroke-width: 1.25; stroke-dasharray: 4 3 }
    .line { stroke: #d2d2d2; stroke-width: 1.25; fill: none }
    .white { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ededed } .mid { fill: #9e9e9e } .dim { fill: #7c7c7c }
      .need { fill: #4054f0; stroke: #4054f0 }
      .skip { stroke: #444444 } .line { stroke: #383838 }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
    .l { font-size: 10px; letter-spacing: 0.09em }
    .s { font-size: 10.5px } .n { font-size: 10.5px; font-weight: 500 }
  </style>

  <text class="l mid" x="0" y="10">WHAT YOU CANNOT SKIP</text>

  <line class="line" x1="34" y1="40" x2="34" y2="252"/>

  <circle class="need" cx="34" cy="44" r="6"/>
  <text class="n ink" x="52" y="48">Splash</text>
  <text class="s dim" x="52" y="63">the orb, while it loads</text>

  <circle class="need" cx="34" cy="86" r="6"/>
  <text class="n ink" x="52" y="90">Language</text>
  <text class="s dim" x="52" y="105">six of them, and the pill stays reachable afterwards</text>

  <circle class="need" cx="34" cy="128" r="6"/>
  <text class="n ink" x="52" y="132">Log in, or register</text>
  <text class="s dim" x="52" y="147">&#8220;continue right away&#8221; against &#8220;in just 2 minutes&#8221;</text>

  <circle class="need" cx="34" cy="170" r="6"/>
  <text class="n ink" x="52" y="174">Phone or email, then a code</text>
  <text class="s dim" x="52" y="189">no password is ever set</text>

  <circle class="skip" cx="34" cy="212" r="6"/>
  <text class="n mid" x="52" y="216">Local or travelling</text>
  <text class="s dim" x="52" y="231">has a close button</text>

  <circle class="skip" cx="34" cy="254" r="6"/>
  <text class="n mid" x="52" y="258">Add a card</text>
  <text class="s dim" x="52" y="273">has a close button, over a blurred home you can already see</text>

  <text class="s mid" x="0" y="298">Two screens stand between opening the app and owning an account. Everything after is optional.</text>
</svg>
