<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 330" width="552" height="330" role="img" aria-label="The 22 pieces grouped two ways. By audience: 13 aimed at drivers and 9 at passengers. By campaign family: 6 driver recruitment, 4 driver incentives, 4 events and partnerships, 3 national holiday pieces, and 5 passenger service pieces. By format: 16 at four by five for the feed, 2 wide group covers, 2 at three by two, 1 square and 1 video at sixteen by nine.">
  <style>
    .ink { fill: #111111 } .mid { fill: #888888 } .dim { fill: #a3a3a3 }
    .a { fill: #dbdbdb } .key { fill: #2a3fdb } .warm { fill: #b8b8b8 }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ededed } .mid { fill: #9e9e9e } .dim { fill: #7c7c7c }
      .a { fill: #2c2c2c } .key { fill: #4054f0 } .warm { fill: #3d3d3d }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
    .l { font-size: 10px; letter-spacing: 0.09em }
    .s { font-size: 10.5px } .n { font-size: 11px; font-weight: 500 }
  </style>

  <text class="l mid" x="0" y="10">WHO EACH PIECE IS TALKING TO</text>
  <rect class="key" x="0"   y="22" width="290" height="16" rx="2"/>
  <rect class="a"   x="292" y="22" width="200" height="16" rx="2"/>
  <text class="n ink" x="8" y="34" fill="#ffffff">13 drivers</text>
  <text class="n ink" x="300" y="34">9 passengers</text>

  <text class="l mid" x="0" y="72">CAMPAIGN FAMILIES</text>
  <rect class="key"  x="0"   y="84" width="134" height="16" rx="2"/>
  <rect class="warm" x="136" y="84" width="88"  height="16" rx="2"/>
  <rect class="a"    x="226" y="84" width="88"  height="16" rx="2"/>
  <rect class="warm" x="316" y="84" width="66"  height="16" rx="2"/>
  <rect class="a"    x="384" y="84" width="110" height="16" rx="2"/>
  <text class="s ink" x="0"   y="116">6 recruitment</text>
  <text class="s ink" x="136" y="116">4 incentives</text>
  <text class="s ink" x="226" y="116">4 events</text>
  <text class="s ink" x="316" y="116">3 Naadam</text>
  <text class="s ink" x="384" y="116">5 passenger</text>

  <text class="l mid" x="0" y="158">FORMATS</text>

  <rect class="a" x="0" y="172" width="44" height="55" rx="3"/>
  <text class="n ink" x="52" y="190">16</text>
  <text class="s mid" x="52" y="206">4:5, the feed</text>
  <text class="s dim" x="52" y="222">poster</text>

  <rect class="a" x="128" y="172" width="70" height="27" rx="3"/>
  <text class="n ink" x="206" y="186">2</text>
  <text class="s mid" x="206" y="202">wide group</text>
  <text class="s dim" x="206" y="218">covers</text>

  <rect class="a" x="272" y="172" width="54" height="36" rx="3"/>
  <text class="n ink" x="334" y="186">2</text>
  <text class="s mid" x="334" y="202">3:2 link</text>
  <text class="s dim" x="334" y="218">cards</text>

  <rect class="a" x="396" y="172" width="40" height="40" rx="3"/>
  <text class="n ink" x="444" y="186">1</text>
  <text class="s mid" x="444" y="202">square</text>

  <rect class="a" x="396" y="222" width="48" height="27" rx="3"/>
  <text class="n ink" x="452" y="236">1</text>
  <text class="s mid" x="452" y="250">video</text>

  <text class="s mid" x="0" y="278">Three quarters of the work is one shape, because the feed is one shape.</text>
  <text class="s dim" x="0" y="298">The exceptions all have a reason: a group cover is wide, a link card is 3:2,</text>
  <text class="s dim" x="0" y="318">a video is 16:9. Nothing is off-format for the sake of it.</text>
</svg>
