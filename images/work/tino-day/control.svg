<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 212" width="552" height="212" role="img" aria-label="Diagram of the go-online control in three states, drawn to one scale. Off duty: a 0 percent chip welded above a 204 by 48 button reading turn service on, a single line. Running: a countdown badge appears above, the chip fills in, and a second line reading 0 percent commission appears inside the button as its inner frame grows from 20 to 36 points. Ending: the button widens from 204 to 223 points to fit the longer word for turn service off, with a dashed line marking the old width.">
  <style>
    .ink  { fill: #111111 }
    .mid  { fill: #888888 }
    .dim  { fill: #a3a3a3 }
    .btn  { fill: #ffffff; stroke: #dedede; stroke-width: 1.25 }
    .chip { fill: #efefef; stroke: #dedede; stroke-width: 1.25 }
    .on   { fill: #2a3fdb; stroke: #2a3fdb; stroke-width: 1.25 }
    .was  { stroke: #b9b9b9; stroke-width: 1; stroke-dasharray: 3 3; fill: none }
    .white{ fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #ededed }
      .mid  { fill: #9e9e9e }
      .dim  { fill: #7c7c7c }
      .btn  { fill: #171717; stroke: #2e2e2e }
      .chip { fill: #212121; stroke: #2e2e2e }
      .on   { fill: #4054f0; stroke: #4054f0 }
      .was  { stroke: #4a4a4a }
    }
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
    .l { font-size: 10px; letter-spacing: 0.09em }
    .t { font-size: 10px; font-weight: 500 }
    .s { font-size: 10.5px }
    .n { font-size: 8.5px }
  </style>

  <!-- All three columns are drawn at 0.70 of the real design points. -->

  <!-- OFF DUTY -->
  <text class="l mid" x="0" y="10">OFF DUTY</text>
  <rect class="chip" x="0" y="44" width="69" height="30" rx="8"/>
  <text class="t ink" x="9" y="59">0%</text>
  <text class="n dim" x="9" y="69">&#1096;&#1080;&#1084;&#1090;&#1075;&#1101;&#1083;</text>
  <rect class="btn" x="0" y="74" width="143" height="34" rx="9"/>
  <circle cx="17" cy="91" r="6" fill="none" stroke="#a3a3a3" stroke-width="1.25"/>
  <text class="t ink" x="30" y="94">&#1198;&#1081;&#1083;&#1095;&#1080;&#1083;&#1075;&#1101;&#1101; &#1072;&#1089;&#1072;&#1072;&#1093;</text>
  <text class="s dim" x="0" y="136">One line. The perk is named</text>
  <text class="s dim" x="0" y="152">but not running yet.</text>
  <text class="s mid" x="0" y="180">204 &#215; 48</text>

  <!-- RUNNING -->
  <text class="l mid" x="196" y="10">RUNNING</text>
  <rect class="btn" x="196" y="20" width="64" height="18" rx="5"/>
  <text class="n ink" x="203" y="32">&#8987; 24:00:00</text>
  <rect class="on" x="196" y="44" width="69" height="30" rx="8"/>
  <text class="t white" x="205" y="59">0%</text>
  <text class="n white" x="205" y="69" opacity="0.85">&#1096;&#1080;&#1084;&#1090;&#1075;&#1101;&#1083;</text>
  <rect class="btn" x="196" y="74" width="143" height="34" rx="9"/>
  <circle cx="213" cy="91" r="6" fill="none" stroke="#2a3fdb" stroke-width="1.5"/>
  <text class="t ink" x="226" y="89">&#1198;&#1081;&#1083;&#1095;&#1080;&#1083;&#1075;&#1101;&#1101; &#1072;&#1089;&#1072;&#1072;&#1093;</text>
  <text class="n mid" x="226" y="100">0% &#1096;&#1080;&#1084;&#1090;&#1075;&#1101;&#1083;</text>
  <text class="s dim" x="196" y="136">A second line switches on</text>
  <text class="s dim" x="196" y="152">inside the button, and the</text>
  <text class="s dim" x="196" y="168">countdown sits clear of the map.</text>
  <text class="s mid" x="196" y="196">inner frame 20 &#8594; 36</text>

  <!-- ENDING -->
  <text class="l mid" x="392" y="10">ENDING</text>
  <rect class="btn" x="392" y="20" width="64" height="18" rx="5"/>
  <text class="n ink" x="399" y="32">&#8987; 23:15:10</text>
  <rect class="on" x="392" y="44" width="69" height="30" rx="8"/>
  <text class="t white" x="401" y="59">0%</text>
  <text class="n white" x="401" y="69" opacity="0.85">&#1096;&#1080;&#1084;&#1090;&#1075;&#1101;&#1083;</text>
  <rect class="btn" x="392" y="74" width="156" height="34" rx="9"/>
  <path class="was" d="M535 70 L535 112"/>
  <circle cx="409" cy="91" r="6" fill="none" stroke="#d64545" stroke-width="1.5"/>
  <text class="t ink" x="422" y="89">&#1198;&#1081;&#1083;&#1095;&#1080;&#1083;&#1075;&#1101;&#1101; &#1091;&#1085;&#1090;&#1088;&#1072;&#1072;&#1093;</text>
  <text class="n mid" x="422" y="100">0% &#1096;&#1080;&#1084;&#1090;&#1075;&#1101;&#1083;</text>
  <text class="s dim" x="392" y="136">The longer word gets a wider</text>
  <text class="s dim" x="392" y="152">button rather than a truncation.</text>
  <text class="s dim" x="392" y="168">The dashed line is the old edge.</text>
  <text class="s mid" x="392" y="196">204 &#8594; 223</text>
</svg>
